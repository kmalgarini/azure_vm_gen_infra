#cloud-config
# ---------------------------------------------------------------------------
# cloud-init bootstrap template
#
# This file is rendered by Terraform's templatefile() function before being
# base64-encoded and passed as custom_data to the Azure VM.
#
# Template variables (replaced by Terraform):
#   ${app_repo}                   — Git URL of the Python application
#   ${app_port}                   — TCP port the app listens on
#   ${app_env}                    — Deployment environment (dev / staging / prod)
#   ${restocking_dtrs_per_batch}  — DTRs per BCR batch (default 3)
#   ${restocking_fail_rate}       — Lifecycle abandon probability (default 0.05)
#   ${restocking_artefact_retention_days} — Days to retain artefact files (default 7)
#   ${job_hold_ticks}             — Ticks to hold terminal job status (default 2)
#   ${job_no_change_prob}         — Probability a job stays in its current status (default 0.40)
# ---------------------------------------------------------------------------

package_update: true
package_upgrade: true

packages:
  - python3.11
  - python3.11-venv
  - python3-pip
  - git
  - nginx
  - curl

# Write systemd unit files and nginx config before runcmd executes.
write_files:
  - path: /etc/systemd/system/app.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Python Application
      Documentation=https://github.com/
      After=network.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=appuser
      Group=appuser
      WorkingDirectory=/opt/app/app
      EnvironmentFile=/opt/app/.env
      ExecStart=/opt/app/.venv/bin/uvicorn main:app --host 0.0.0.0 --port ${app_port} --workers 2
      ExecReload=/bin/kill -HUP $MAINPID
      Restart=always
      RestartSec=5
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=app

      # Hardening
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ReadWritePaths=/opt/app

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/restocking-generator.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Restocking File Generator (oneshot)
      After=network.target

      [Service]
      Type=oneshot
      User=appuser
      Group=appuser
      WorkingDirectory=/opt/app/app
      EnvironmentFile=/opt/app/.env
      ExecStart=/opt/app/.venv/bin/python /opt/app/app/restocking_file_generator.py
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=restocking-generator
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ReadWritePaths=/opt/app /var/restocking

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/restocking-generator.timer
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Run Restocking File Generator every 5 minutes
      Requires=restocking-generator.service

      [Timer]
      OnCalendar=*:0/5
      Persistent=true
      AccuracySec=10s

      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/job-status-generator.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Job Status Generator (oneshot)
      After=network.target

      [Service]
      Type=oneshot
      User=appuser
      Group=appuser
      WorkingDirectory=/opt/app/app
      EnvironmentFile=/opt/app/.env
      ExecStart=/opt/app/.venv/bin/python /opt/app/app/job_status_generator.py
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=job-status-generator
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ReadWritePaths=/opt/app /var/jobs

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/job-status-generator.timer
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Run Job Status Generator every minute
      Requires=job-status-generator.service

      [Timer]
      OnCalendar=*:*:00
      Persistent=true
      AccuracySec=5s

      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/dtr-cleanup.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Delete DTR artefact files older than retention window
      After=network.target

      [Service]
      Type=oneshot
      User=appuser
      Group=appuser
      EnvironmentFile=/opt/app/.env
      ExecStart=/bin/bash -c 'find "$RESTOCKING_INBOUND_DIR" -maxdepth 1 -type f -mtime +$RESTOCKING_ARTEFACT_RETENTION_DAYS -delete && echo "DTR cleanup complete"'
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=dtr-cleanup
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ReadWritePaths=/var/restocking

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/dtr-cleanup.timer
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Daily DTR artefact cleanup at 02:00 UTC
      Requires=dtr-cleanup.service

      [Timer]
      OnCalendar=*-*-* 02:00:00 UTC
      Persistent=true
      AccuracySec=5m

      [Install]
      WantedBy=timers.target

  - path: /etc/logrotate.d/job-events
    permissions: "0644"
    owner: root:root
    content: |
      /var/jobs/events.jsonl {
          daily
          rotate 14
          compress
          missingok
          notifempty
          copytruncate
      }

  - path: /etc/nginx/sites-available/app
    permissions: "0644"
    owner: root:root
    content: |
      server {
          listen 80;
          server_name _;

          location / {
              proxy_pass         http://127.0.0.1:${app_port};
              proxy_http_version 1.1;
              proxy_set_header   Host              $host;
              proxy_set_header   X-Real-IP         $remote_addr;
              proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
              proxy_set_header   X-Forwarded-Proto $scheme;
              proxy_read_timeout 60s;
          }
      }

runcmd:
  # Create a system user with no login shell for running the app.
  - useradd --system --shell /usr/sbin/nologin --home-dir /opt/app appuser

  # Clone the application repository.
  - git clone ${app_repo} /opt/app

  # Write the runtime environment file.
  - |
    cat > /opt/app/.env <<'EOF'
    APP_ENV=${app_env}
    APP_PORT=${app_port}
    RESTOCKING_INBOUND_DIR=/var/restocking/inbound
    RESTOCKING_STATE_FILE=/opt/app/generator_state.json
    RESTOCKING_DTRS_PER_BATCH=${restocking_dtrs_per_batch}
    RESTOCKING_FAIL_RATE=${restocking_fail_rate}
    RESTOCKING_ARTEFACT_RETENTION_DAYS=${restocking_artefact_retention_days}
    JOB_OUTPUT_DIR=/var/jobs
    JOB_STATE_FILE=/opt/app/job_state.json
    JOB_HOLD_TICKS=${job_hold_ticks}
    JOB_NO_CHANGE_PROB=${job_no_change_prob}
    EOF

  # Lock down ownership before anything else runs as appuser.
  - chown -R appuser:appuser /opt/app
  - chmod 640 /opt/app/.env

  # Create the virtual environment and install dependencies.
  - python3.11 -m venv /opt/app/.venv
  - /opt/app/.venv/bin/pip install --quiet --upgrade pip
  - /opt/app/.venv/bin/pip install --quiet -r /opt/app/app/requirements.txt

  # Load the new systemd unit and start the app.
  - systemctl daemon-reload
  - systemctl enable app
  - systemctl start app

  # Enable and configure nginx as a reverse proxy (port 80 → app_port).
  - ln -sf /etc/nginx/sites-available/app /etc/nginx/sites-enabled/app
  - rm -f /etc/nginx/sites-enabled/default
  - nginx -t
  - systemctl enable nginx
  - systemctl restart nginx

  # Create the restocking inbound directory, owned by appuser.
  - mkdir -p /var/restocking/inbound
  - chown appuser:appuser /var/restocking/inbound

  # Enable and start the restocking file generator timer.
  - systemctl enable restocking-generator.timer
  - systemctl start restocking-generator.timer

  # Create the jobs output directory, owned by appuser.
  - mkdir -p /var/jobs
  - chown appuser:appuser /var/jobs

  # Enable and start the job status generator timer.
  - systemctl enable job-status-generator.timer
  - systemctl start job-status-generator.timer

  # Enable and start the DTR artefact cleanup timer (runs daily at 02:00 UTC).
  - systemctl enable dtr-cleanup.timer
  - systemctl start dtr-cleanup.timer
